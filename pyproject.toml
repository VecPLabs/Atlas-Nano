[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-nano"
version = "1.0.0"
description = "LLM Safety Classification Pipeline using Vectorial Projection (VecP)"
readme = "README.md"
license = {text = "Proprietary - Patent Pending USPTO 63/931,565"}
requires-python = ">=3.10"
authors = [
    {name = "David Cappelli", email = "david@vecplabs.com"},
]
keywords = ["llm", "safety", "classification", "ai-safety", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.51.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "cma>=3.3.0",
]

[project.optional-dependencies]
gguf = ["gguf>=0.6.0"]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[project.scripts]
atlas-nano = "atlas_nano.cli:main"

[project.urls]
Homepage = "https://github.com/VecPLabs/Atlas-Nano"

[tool.setuptools.packages.find]
include = ["atlas_nano*"]
