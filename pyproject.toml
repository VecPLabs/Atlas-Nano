[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-nano"
version = "0.1.0"
description = "Research-preview, model-coupled LLM safety sensing toolkit using vectorial projection"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "David Cappelli", email = "david@vecplabs.com"},
]
keywords = ["llm", "safety", "classification", "ai-safety", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "torch>=2.1.0,<3",
    "transformers>=4.51.0,<5",
    "numpy>=1.24.0,<3",
    "pyyaml>=6.0,<7",
    "cma>=3.3.0,<5",
]

[project.optional-dependencies]
gguf = ["gguf>=0.6.0,<1"]
dev = ["build>=1.2,<2", "pytest>=7.0,<9", "ruff>=0.4,<1"]

[project.scripts]
atlas-nano = "atlas_nano.cli:main"

[project.urls]
Homepage = "https://github.com/VecPLabs/Atlas-Nano"
Documentation = "https://github.com/VecPLabs/Atlas-Nano#readme"
Issues = "https://github.com/VecPLabs/Atlas-Nano/issues"
Changelog = "https://github.com/VecPLabs/Atlas-Nano/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["atlas_nano*", "sign_check_atlas*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
atlas_nano = ["data/*.txt", "data/*.md"]
