<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Atlas Nano — Safety Console</title>
<meta name="viewport" content="width=1400" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark" data-variant="console" data-density="comfortable" data-accent="amber">

<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.25"/><line x1="4" y1="18" x2="20" y2="6" stroke="currentColor" stroke-width="1.25"/><circle cx="8.5" cy="14.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="9.5" r="1.5" fill="currentColor"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Atlas Nano</div>
        <div class="brand-sub">Sign-Check · v1.0</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-section">Operations</div>
      <a data-screen="monitoring" class="nav-item active">
        <span class="nav-dot"></span>Live Monitoring<span class="nav-badge" id="nav-flag-count">0</span>
      </a>
      <a data-screen="models" class="nav-item">
        <span class="nav-dot"></span>Models<span class="nav-meta">4</span>
      </a>
      <a data-screen="calibration" class="nav-item">
        <span class="nav-dot"></span>Calibration
      </a>

      <div class="nav-section">Reference</div>
      <a data-screen="categories" class="nav-item">
        <span class="nav-dot"></span>Categories
      </a>
      <a data-screen="gauntlet" class="nav-item">
        <span class="nav-dot"></span>Gauntlets
      </a>
      <a data-screen="audit" class="nav-item">
        <span class="nav-dot"></span>Audit Log
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="status-row">
        <span class="pulse"></span>
        <span class="status-text">All gates nominal</span>
      </div>
      <div class="status-sub">US-East · node atlas-03</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="crumb" id="crumb">Operations <span class="crumb-sep">/</span> <b>Live Monitoring</b></div>
      </div>
      <div class="topbar-center">
        <div class="cmdk">
          <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="13" y1="13" x2="17" y2="17" stroke="currentColor" stroke-width="1.4"/></svg>
          <input type="text" placeholder="Search prompts, models, categories…" />
          <kbd>⌘K</kbd>
        </div>
      </div>
      <div class="topbar-right">
        <div class="deployment-badge">
          <span class="dep-dot"></span>
          <span>production</span>
          <span class="dep-sep">·</span>
          <span class="mono">qwen3-4b / L22</span>
        </div>
        <button class="icon-btn" id="theme-toggle" title="Toggle theme">
          <svg viewBox="0 0 20 20" width="15" height="15" class="icon-dark" aria-hidden="true"><path d="M15 11.5a6 6 0 1 1-6.5-8 5 5 0 0 0 6.5 8z" fill="currentColor"/></svg>
          <svg viewBox="0 0 20 20" width="15" height="15" class="icon-light" aria-hidden="true"><circle cx="10" cy="10" r="3.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.4"><line x1="10" y1="2" x2="10" y2="4"/><line x1="10" y1="16" x2="10" y2="18"/><line x1="2" y1="10" x2="4" y2="10"/><line x1="16" y1="10" x2="18" y2="10"/><line x1="4.3" y1="4.3" x2="5.7" y2="5.7"/><line x1="14.3" y1="14.3" x2="15.7" y2="15.7"/><line x1="4.3" y1="15.7" x2="5.7" y2="14.3"/><line x1="14.3" y1="5.7" x2="15.7" y2="4.3"/></g></svg>
        </button>
        <div class="user-chip">
          <div class="avatar">DC</div>
          <div>
            <div class="user-name">D. Cappelli</div>
            <div class="user-role">admin</div>
          </div>
        </div>
      </div>
    </header>

    <section class="screen-host" id="screen-host"><!-- screens injected here --></section>
  </main>
</div>

<!-- Tweaks panel (hidden until activated) -->
<div id="tweaks-panel" class="tweaks" hidden>
  <div class="tweaks-head">
    <div>
      <div class="tweaks-title">Tweaks</div>
      <div class="tweaks-sub">Aesthetic variations · live</div>
    </div>
    <button id="tweaks-close" class="icon-btn" aria-label="Close">×</button>
  </div>
  <div class="tweaks-body">
    <div class="tweak-row">
      <label>Variant</label>
      <div class="seg" data-tweak="variant">
        <button data-val="console">Console</button>
        <button data-val="editorial">Editorial</button>
        <button data-val="terminal">Terminal</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>Theme</label>
      <div class="seg" data-tweak="theme">
        <button data-val="dark">Dark</button>
        <button data-val="light">Light</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>Density</label>
      <div class="seg" data-tweak="density">
        <button data-val="comfortable">Comfortable</button>
        <button data-val="compact">Compact</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>Accent</label>
      <div class="seg" data-tweak="accent">
        <button data-val="amber">Amber</button>
        <button data-val="cyan">Cyan</button>
        <button data-val="violet">Violet</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>Stream</label>
      <div class="seg" data-tweak="stream">
        <button data-val="live">Live</button>
        <button data-val="paused">Paused</button>
      </div>
    </div>
  </div>
</div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screen-monitoring.jsx"></script>
<script type="text/babel" src="screen-models.jsx"></script>
<script type="text/babel" src="screen-calibration.jsx"></script>
<script type="text/babel" src="screen-misc.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script>
/* Atlas Nano — Tweaks inlined */
(function() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "variant": "console",
    "theme": "dark",
    "density": "comfortable",
    "accent": "amber",
    "stream": "live"
  }/*EDITMODE-END*/;
  const state = Object.assign({}, TWEAK_DEFAULTS);
  function apply() {
    document.body.setAttribute("data-variant",  state.variant);
    document.body.setAttribute("data-theme",    state.theme);
    document.body.setAttribute("data-density",  state.density);
    document.body.setAttribute("data-accent",   state.accent);
    window.postMessage({ type: "atlas-stream", on: state.stream === "live" }, "*");
    document.querySelectorAll(".seg").forEach(seg => {
      const key = seg.getAttribute("data-tweak");
      seg.querySelectorAll("button").forEach(b => {
        b.classList.toggle("on", b.getAttribute("data-val") === state[key]);
      });
    });
  }
  function set(key, val) {
    state[key] = val;
    apply();
    try { window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[key]: val}}, '*'); } catch (e) {}
  }
  document.querySelectorAll(".seg").forEach(seg => {
    const key = seg.getAttribute("data-tweak");
    seg.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => set(key, btn.getAttribute("data-val")));
    });
  });
  const themeBtn = document.getElementById("theme-toggle");
  if (themeBtn) themeBtn.addEventListener("click", () => set("theme", state.theme === "dark" ? "light" : "dark"));
  const closeBtn = document.getElementById("tweaks-close");
  const panel = document.getElementById("tweaks-panel");
  function show() { panel.hidden = false; }
  function hide() { panel.hidden = true;  }
  if (closeBtn) closeBtn.addEventListener("click", hide);
  window.addEventListener("message", (ev) => {
    const d = ev && ev.data || {};
    if (d.type === "__activate_edit_mode")   show();
    if (d.type === "__deactivate_edit_mode") hide();
  });
  try { window.parent.postMessage({type: '__edit_mode_available'}, '*'); } catch (e) {}
  apply();
})();
</script>

</body>
</html>
