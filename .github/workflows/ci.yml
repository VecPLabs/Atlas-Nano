name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install numpy pyyaml
          python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: GGUF round-trip tests
        run: python tests/test_gguf_integration.py --dim 2560
      - name: CLI smoke test
        run: |
          atlas-nano --version
          atlas-nano profile validate profiles/qwen3-4b-signcheck-v1/profile.json --model Qwen/Qwen3-4B --architecture Qwen3ForCausalLM --hidden-dim 2560
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
